<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E5DFD3"/>
    </linearGradient>

    <!-- Ceramic Bowl gradient -->
    <radialGradient id="bowl-outer" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E8E4DA"/>
      <stop offset="100%" stop-color="#C2BCAC"/>
    </radialGradient>
    <radialGradient id="bowl-inner" cx="48%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ECE8DF"/>
      <stop offset="85%" stop-color="#DBD4C3"/>
      <stop offset="100%" stop-color="#8F8775"/>
    </radialGradient>

    <!-- Bowl drop shadow -->
    <filter id="bowl-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#2D281E" flood-opacity="0.22"/>
    </filter>
    <filter id="item-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#1E2B15" flood-opacity="0.18"/>
    </filter>

    <!-- Greens gradients -->
    <linearGradient id="kale-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22542B"/>
      <stop offset="100%" stop-color="#143419"/>
    </linearGradient>
    <linearGradient id="leaf-bright" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#559938"/>
      <stop offset="100%" stop-color="#2F661E"/>
    </linearGradient>
    <linearGradient id="leaf-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BB83C"/>
      <stop offset="100%" stop-color="#497A1F"/>
    </linearGradient>

    <!-- Tomato gradients -->
    <radialGradient id="tomato-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5C4D"/>
      <stop offset="40%" stop-color="#E82A1B"/>
      <stop offset="90%" stop-color="#A5150A"/>
      <stop offset="100%" stop-color="#670B04"/>
    </radialGradient>
    <radialGradient id="tomato-yellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="60%" stop-color="#E59400"/>
      <stop offset="100%" stop-color="#A85700"/>
    </radialGradient>

    <!-- Avocado gradients -->
    <linearGradient id="avo-flesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F099"/>
      <stop offset="50%" stop-color="#C5DE67"/>
      <stop offset="85%" stop-color="#6F9936"/>
      <stop offset="100%" stop-color="#3D591D"/>
    </linearGradient>

    <!-- Quinoa / Chickpeas gradients -->
    <radialGradient id="chickpea" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="70%" stop-color="#B87C39"/>
      <stop offset="100%" stop-color="#73471A"/>
    </radialGradient>

    <!-- Dressing drizzle -->
    <linearGradient id="tahini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="100%" stop-color="#D6BA79"/>
    </linearGradient>
  </defs>

  <!-- Table background surface -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Subtle linen texture lines -->
  <g opacity="0.04" stroke="#000000" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="720" x2="800" y2="720"/>
    <line x1="0" y1="840" x2="800" y2="840"/>
  </g>

  <!-- Ceramic Bowl -->
  <g filter="url(#bowl-shadow)">
    <!-- Outer rim -->
    <ellipse cx="400" cy="510" rx="315" ry="315" fill="url(#bowl-outer)"/>
    <!-- Bowl depth / inner wall -->
    <ellipse cx="400" cy="508" rx="295" ry="295" fill="url(#bowl-inner)"/>
    <!-- Bowl interior base -->
    <ellipse cx="400" cy="510" rx="275" ry="275" fill="#D2CABA" opacity="0.7"/>
  </g>

  <!-- Salad contents -->
  <g>
    <!-- Base bed of dark greens & baby spinach -->
    <g filter="url(#item-shadow)">
      <path d="M 230 450 C 200 400 240 330 310 340 C 370 350 360 410 330 440 Z" fill="url(#kale-dark)" transform="rotate(-15 270 390)"/>
      <path d="M 460 360 C 510 310 590 350 580 420 C 570 480 500 470 470 430 Z" fill="url(#leaf-bright)" transform="rotate(25 520 400)"/>
      <path d="M 190 530 C 160 460 210 420 280 450 C 320 480 300 550 250 570 Z" fill="url(#leaf-lime)" transform="rotate(-30 230 500)"/>
      <path d="M 330 330 C 370 290 450 300 460 360 C 470 410 400 430 360 390 Z" fill="url(#kale-dark)"/>
      <path d="M 480 570 C 560 550 610 610 570 680 C 520 720 460 680 460 620 Z" fill="url(#leaf-bright)" transform="rotate(40 520 630)"/>
      <path d="M 240 630 C 210 680 270 740 330 720 C 380 700 370 630 310 610 Z" fill="url(#leaf-lime)"/>
      <path d="M 360 670 C 410 730 490 710 490 640 C 480 590 410 590 380 630 Z" fill="url(#kale-dark)"/>
    </g>

    <!-- Quinoa & Ancient grains bed (subtle texture dots & clusters) -->
    <g fill="#D5BE9B">
      <ellipse cx="360" cy="500" rx="45" ry="35" opacity="0.8"/>
      <ellipse cx="430" cy="530" rx="50" ry="40" opacity="0.85"/>
      <ellipse cx="390" cy="470" rx="40" ry="30" opacity="0.75"/>
    </g>
    <!-- Grains specs -->
    <g fill="#A88C64" opacity="0.6">
      <circle cx="340" cy="490" r="3"/><circle cx="355" cy="505" r="2.5"/><circle cx="370" cy="485" r="3"/>
      <circle cx="365" cy="515" r="2.8"/><circle cx="420" cy="520" r="3"/><circle cx="440" cy="540" r="2.5"/>
      <circle cx="435" cy="510" r="3"/><circle cx="400" cy="465" r="2.7"/><circle cx="385" cy="480" r="3.2"/>
    </g>

    <!-- Roasted Spiced Chickpeas -->
    <g filter="url(#item-shadow)">
      <circle cx="320" cy="570" r="18" fill="url(#chickpea)"/>
      <circle cx="350" cy="590" r="17" fill="url(#chickpea)"/>
      <circle cx="310" cy="610" r="16" fill="url(#chickpea)"/>
      <circle cx="280" cy="580" r="17" fill="url(#chickpea)"/>
      <circle cx="340" cy="550" r="15" fill="url(#chickpea)"/>
    </g>

    <!-- Sliced Avocado Fan -->
    <g filter="url(#item-shadow)">
      <path d="M 440 440 C 470 420 530 460 540 500 C 545 530 515 540 480 510 C 450 480 435 460 440 440 Z" fill="url(#avo-flesh)"/>
      <path d="M 460 460 C 490 440 550 480 560 520 C 565 550 535 560 500 530 C 470 500 455 480 460 460 Z" fill="url(#avo-flesh)"/>
      <path d="M 480 485 C 510 465 565 500 575 545 C 580 575 550 585 520 555 C 490 525 475 505 480 485 Z" fill="url(#avo-flesh)"/>
      <!-- Avocado peel thin edge -->
      <path d="M 540 500 Q 550 530 515 540" stroke="#253A10" stroke-width="4" fill="none"/>
      <path d="M 560 520 Q 570 550 535 560" stroke="#253A10" stroke-width="4" fill="none"/>
      <path d="M 575 545 Q 585 575 550 585" stroke="#253A10" stroke-width="4" fill="none"/>
    </g>

    <!-- Cherry Tomatoes (Halves and wholes) -->
    <g filter="url(#item-shadow)">
      <!-- Whole red cherry tomato -->
      <circle cx="270" cy="420" r="24" fill="url(#tomato-red)"/>
      <ellipse cx="262" cy="412" rx="7" ry="4" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 262 412)"/>
      <!-- Tomato stem -->
      <path d="M 270 420 L 265 402 M 270 420 L 278 405 M 270 420 L 282 418" stroke="#487A24" stroke-width="3" stroke-linecap="round"/>

      <!-- Cut red tomato half with visible pulp & seeds -->
      <ellipse cx="420" cy="390" rx="28" ry="24" fill="url(#tomato-red)" transform="rotate(20 420 390)"/>
      <ellipse cx="420" cy="390" rx="22" ry="18" fill="#B71C10" transform="rotate(20 420 390)"/>
      <ellipse cx="414" cy="386" rx="6" ry="4" fill="#6A0C04"/>
      <circle cx="412" cy="385" r="2.5" fill="#FFE27A"/>
      <ellipse cx="427" cy="392" rx="6" ry="4" fill="#6A0C04"/>
      <circle cx="425" cy="391" r="2.5" fill="#FFE27A"/>
      <ellipse cx="415" cy="378" rx="8" ry="3" fill="#FFFFFF" opacity="0.45" transform="rotate(15 415 378)"/>

      <!-- Golden heirloom tomato half -->
      <ellipse cx="490" cy="620" rx="26" ry="22" fill="url(#tomato-yellow)" transform="rotate(-35 490 620)"/>
      <ellipse cx="490" cy="620" rx="20" ry="16" fill="#C27B00" transform="rotate(-35 490 620)"/>
      <ellipse cx="485" cy="618" rx="5" ry="3" fill="#6B4100"/>
      <circle cx="484" cy="617" r="2" fill="#FFF4A3"/>
      <ellipse cx="482" cy="610" rx="7" ry="3" fill="#FFFFFF" opacity="0.5"/>

      <!-- Another whole cherry tomato -->
      <circle cx="390" cy="635" r="22" fill="url(#tomato-red)"/>
      <ellipse cx="383" cy="628" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.6" transform="rotate(-20 383 628)"/>
    </g>

    <!-- Cucumbers slices -->
    <g filter="url(#item-shadow)">
      <circle cx="460" cy="460" r="24" fill="#CCE8A7" stroke="#3D6E26" stroke-width="4"/>
      <circle cx="460" cy="460" r="16" fill="#E6F5CF" stroke="#8CB86C" stroke-dasharray="3,3" stroke-width="2"/>

      <circle cx="390" cy="430" r="23" fill="#CCE8A7" stroke="#3D6E26" stroke-width="4"/>
      <circle cx="390" cy="430" r="15" fill="#E6F5CF" stroke="#8CB86C" stroke-dasharray="3,3" stroke-width="2"/>
    </g>

    <!-- Microgreens & Fresh Herb Garnish (coriander/parsley) -->
    <g stroke="#37681C" stroke-width="2" fill="none">
      <path d="M 370 510 Q 360 480 345 470"/>
      <path d="M 345 470 Q 338 465 330 472"/>
      <path d="M 345 470 Q 348 460 340 455"/>

      <path d="M 410 490 Q 430 470 440 450"/>
      <path d="M 440 450 Q 450 445 448 438"/>
      <path d="M 440 450 Q 435 440 425 442"/>
    </g>

    <!-- Creamy Tahini-Lemon Dressing Drizzle -->
    <path d="M 280 470 Q 320 440 370 490 T 450 510 T 520 490" fill="none" stroke="url(#tahini)" stroke-width="9" stroke-linecap="round" opacity="0.9" filter="url(#item-shadow)"/>
    <path d="M 310 540 Q 360 560 420 540 T 480 580" fill="none" stroke="url(#tahini)" stroke-width="7" stroke-linecap="round" opacity="0.85" filter="url(#item-shadow)"/>

    <!-- Toasted Black and White Sesame Seeds -->
    <g fill="#1F2421" opacity="0.85">
      <ellipse cx="430" cy="445" rx="3" ry="1.5" transform="rotate(30 430 445)"/>
      <ellipse cx="445" cy="455" rx="3" ry="1.5" transform="rotate(-40 445 455)"/>
      <ellipse cx="470" cy="495" rx="3" ry="1.5" transform="rotate(15 470 495)"/>
      <ellipse cx="375" cy="505" rx="3" ry="1.5" transform="rotate(70 375 505)"/>
      <ellipse cx="340" cy="580" rx="3" ry="1.5" transform="rotate(25 340 580)"/>
      <ellipse cx="295" cy="590" rx="3" ry="1.5" transform="rotate(-60 295 590)"/>
    </g>
    <g fill="#FFFDF5" opacity="0.95">
      <ellipse cx="420" cy="450" rx="3" ry="1.5" transform="rotate(60 420 450)"/>
      <ellipse cx="480" cy="505" rx="3" ry="1.5" transform="rotate(-20 480 505)"/>
      <ellipse cx="360" cy="515" rx="3" ry="1.5" transform="rotate(45 360 515)"/>
      <ellipse cx="355" cy="575" rx="3" ry="1.5" transform="rotate(-15 355 575)"/>
    </g>
  </g>

  <!-- Soft top lighting / gloss reflection on the ceramic bowl rim -->
  <path d="M 180 360 A 300 300 0 0 1 620 360" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>
</svg>

